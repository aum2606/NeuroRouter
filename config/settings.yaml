app:
  name: NeuroRouter
  environment: development
  log_level: INFO

capabilities:
  web_search_available: true
  rag_available: true
  code_available: true
  finance_agent_available: true

telemetry:
  database_path: data/neurorouter.db
  log_raw_jev_responses: true

web_search:
  provider: wikipedia
  max_queries: 3
  results_per_query: 5
  timeout_seconds: 10.0

rag:
  collection_name: neurorouter_documents
  persist_directory: data/chroma
  embedding_provider: hashing
  embedding_dimensions: 384
  chunk_size: 1000
  chunk_overlap: 150
  retrieval_top_k: 5
  minimum_relevance: 0.15
  max_file_size_mb: 25

code_execution:
  enabled: false
  language: python
  timeout_seconds: 2.0
  max_source_characters: 10000
  max_output_characters: 20000

finance:
  require_web_for_current_data: true
  ratio_precision: 4

aggregation:
  context_budget_characters: 24000
  max_agent_output_characters: 2000

jev:
  model: jev-latest
  timeout_seconds: 30.0
  fallback:
    enabled: true
    intent: general_qa
    intent_confidence: 0.0
    needs_web: 0.0
    needs_rag: 0.0
    needs_code: 0.0
    needs_data_analysis: 0.0
    needs_current_information: 0.0
    needs_citations: 0.0
    needs_multi_source_research: 0.0
    complexity_score: 1.0
    complexity_confidence: 0.0
    risk_score: 1.0
    risk_confidence: 0.0

llm:
  provider: mock
  allow_paid_models: false
  request_timeout_seconds: 60.0
  max_output_tokens: 4096
  providers:
    mock:
      enabled: true
      free_tier_only: true
      api_key_env: null
      base_url: null
      model_tiers:
        fast: mock-fast
        standard: mock-standard
        reasoning: mock-reasoning
    groq:
      enabled: true
      free_tier_only: true
      api_key_env: GROQ_API_KEY
      base_url: https://api.groq.com/openai/v1
      model_tiers:
        fast: openai/gpt-oss-20b
        standard: openai/gpt-oss-120b
        reasoning: openai/gpt-oss-120b
    gemini:
      enabled: true
      free_tier_only: true
      api_key_env: GEMINI_API_KEY
      base_url: https://generativelanguage.googleapis.com
      model_tiers:
        fast: gemini-3.5-flash-lite
        standard: gemini-3.6-flash
        reasoning: gemini-3.8-flash
    openrouter:
      enabled: true
      free_tier_only: true
      api_key_env: OPENROUTER_API_KEY
      base_url: https://openrouter.ai/api/v1
      model_tiers:
        fast: openrouter/free
        standard: openrouter/free
        reasoning: openrouter/free

ui:
  page_title: NeuroRouter Control Plane
  page_icon: "🧠"
