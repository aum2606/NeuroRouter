app:
  name: NeuroRouter
  environment: development
  log_level: INFO

capabilities:
  web_search_available: false
  rag_available: true
  code_available: false
  finance_agent_available: false

telemetry:
  database_path: data/neurorouter.db
  log_raw_jev_responses: true

jev:
  model: jev-latest
  timeout_seconds: 30.0
  fallback:
    enabled: true
    intent: general_qa
    intent_confidence: 0.0
    needs_web: 0.0
    needs_rag: 0.0
    needs_code: 0.0
    needs_data_analysis: 0.0
    needs_current_information: 0.0
    needs_citations: 0.0
    needs_multi_source_research: 0.0
    complexity_score: 1.0
    complexity_confidence: 0.0
    risk_score: 1.0
    risk_confidence: 0.0

llm:
  provider: mock
  allow_paid_models: false
  request_timeout_seconds: 60.0
  max_output_tokens: 4096
  providers:
    mock:
      enabled: true
      free_tier_only: true
      api_key_env: null
      base_url: null
      model_tiers:
        fast: mock-fast
        standard: mock-standard
        reasoning: mock-reasoning
    groq:
      enabled: true
      free_tier_only: true
      api_key_env: GROQ_API_KEY
      base_url: https://api.groq.com/openai/v1
      model_tiers:
        fast: llama-3.1-8b-instant
        standard: llama-3.3-70b-versatile
        reasoning: openai/gpt-oss-120b
    gemini:
      enabled: true
      free_tier_only: true
      api_key_env: GEMINI_API_KEY
      base_url: https://generativelanguage.googleapis.com
      model_tiers:
        fast: gemini-2.5-flash-lite
        standard: gemini-2.5-flash
        reasoning: gemini-2.5-flash
    openrouter:
      enabled: true
      free_tier_only: true
      api_key_env: OPENROUTER_API_KEY
      base_url: https://openrouter.ai/api/v1
      model_tiers:
        fast: openrouter/free
        standard: openrouter/free
        reasoning: openrouter/free

ui:
  page_title: NeuroRouter Control Plane
  page_icon: "🧠"
